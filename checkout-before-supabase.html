<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Checkout | FX Fashion Gallery</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f7f7f7;color:#111}header{background:#111;color:#fff;padding:18px 20px}.nav{max-width:900px;margin:auto;display:flex;justify-content:space-between;align-items:center}.logo{font-size:21px;font-weight:900}.logo span{color:#e87900}.back{color:#fff;text-decoration:none}main{max-width:900px;margin:auto;padding:35px 20px}.box{background:#fff;padding:25px;border-radius:14px;margin-bottom:20px;border:1px solid #eee}h1{margin-top:0}h2{font-size:21px}label{display:block;font-weight:bold;margin:15px 0 7px}input,textarea,select{width:100%;padding:13px;border:1px solid #ddd;border-radius:7px;font-size:15px}textarea{min-height:100px;resize:vertical}.payment{background:#f5f5f5;padding:15px;border-radius:8px;margin-top:15px}.row{display:flex;justify-content:space-between;margin:12px 0}.total{border-top:1px solid #ddd;padding-top:15px;font-size:20px;font-weight:900}.order-btn{width:100%;border:0;background:#e87900;color:#fff;padding:15px;border-radius:8px;font-size:16px;font-weight:900;cursor:pointer;margin-top:20px}.notice{font-size:13px;color:#666;margin-top:10px}</style></head><body><header><div class="nav"><div class="logo">FX <span>Fashion Gallery</span></div><a class="back" href="cart.html">← Back to Cart</a></div></header><main><h1>Checkout</h1><div class="box"><h2>Customer Information</h2><form id="orderForm"><label>Full Name</label><input id="name" type="text" placeholder="Enter your full name" required><label>Mobile Number</label><input id="phone" type="tel" placeholder="01XXXXXXXXX" required><label>Delivery Address</label><textarea id="address" placeholder="House/Road/Area/Thana/District" required></textarea><label>Delivery Location</label><select id="location" onchange="updateTotal()" required><option value="">Select delivery location</option><option value="60">Inside Dhaka — ৳60</option><option value="120">Outside Dhaka — ৳120</option></select><div class="payment"><strong>Payment Method: Cash on Delivery</strong><p class="notice">Pay the delivery person when your order arrives.</p></div><div class="box" style="padding:15px;margin-top:20px;background:#fafafa"><div class="row"><span>Products</span><strong id="subtotal">৳0</strong></div><div class="row"><span>Delivery</span><strong id="delivery">৳0</strong></div><div class="row total"><span>Grand Total</span><strong id="grandTotal">৳0</strong></div></div><button class="order-btn" type="submit">Confirm Order — Cash on Delivery</button></form></div></main><script src="products.js"></script><script>function updateTotal(){const c=getCart();const sub=c.reduce((t,x)=>t+x.price*x.quantity,0);const d=Number(document.getElementById("location").value)||0;document.getElementById("subtotal").textContent="৳"+sub.toLocaleString();document.getElementById("delivery").textContent="৳"+d.toLocaleString();document.getElementById("grandTotal").textContent="৳"+(sub+d).toLocaleString()}document.getElementById("orderForm").addEventListener("submit",function(e){e.preventDefault();if(!getCart().length){alert("Your cart is empty.");return}const name=document.getElementById("name").value.trim();const phone=document.getElementById("phone").value.trim();const address=document.getElementById("address").value.trim();const location=document.getElementById("location").value;if(!location){alert("Please select your delivery location.");return}const c=getCart();const sub=c.reduce((t,x)=>t+x.price*x.quantity,0);const total=sub+Number(location);

const order={
  id:"FX-"+Date.now(),
  date:new Date().toISOString(),
  customer:{
    name:name,
    phone:phone,
    address:address
  },
  delivery:Number(location),
  deliveryArea:Number(location)===60?"Inside Dhaka":"Outside Dhaka",
  payment:"Cash on Delivery",
  items:c,
  subtotal:sub,
  total:total,
  status:"New"
};

const orders=JSON.parse(localStorage.getItem("fxOrders")||"[]");
orders.push(order);
localStorage.setItem("fxOrders",JSON.stringify(orders));

let message="FX FASHION GALLERY - NEW ORDER%0A%0AOrder ID: "+encodeURIComponent(order.id)+"%0AName: "+encodeURIComponent(name)+"%0AMobile: "+encodeURIComponent(phone)+"%0AAddress: "+encodeURIComponent(address)+"%0ADelivery: "+encodeURIComponent(order.deliveryArea)+"%0APayment: Cash on Delivery%0A%0A";

c.forEach(x=>{message+=encodeURIComponent(x.name)+" x "+x.quantity+" = ৳"+(x.price*x.quantity)+"%0A"});

message+="%0ASubtotal: ৳"+sub+"%0ADelivery: ৳"+location+"%0AGrand Total: ৳"+total;

localStorage.removeItem("fxCart");

window.location.href="https://wa.me/8801897523321?text="+message});updateTotal();</script></body></html>
