<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>FX Fashion Gallery | Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f4f5f7;color:#151515}
.header{background:linear-gradient(135deg,#080808,#181818);color:#fff;padding:22px 20px}
.brand{font-size:22px;font-weight:900;letter-spacing:1px}
.brand span{color:#e87900}
.subtitle{margin-top:5px;color:#aaa;font-size:13px}
.container{max-width:1100px;margin:auto;padding:22px 20px 45px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:21px;box-shadow:0 6px 22px rgba(0,0,0,.055)}
.label{font-size:13px;color:#777}
.value{font-size:28px;font-weight:900;margin-top:8px}
.orange{color:#e87900}
.section-title:before{content:"";width:4px;height:22px;background:#e87900;border-radius:4px;display:block}.section-title{position:relative;font-size:20px;font-weight:900;margin:28px 0 12px;display:flex;align-items:center;gap:9px}
.panel{background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:21px;box-shadow:0 5px 18px rgba(0,0,0,.045)}
.empty{text-align:center;padding:35px 15px;color:#777}
button{border:0;border-radius:9px;padding:12px 18px;background:linear-gradient(135deg,#e87900,#ff9d32);color:#fff;font-weight:800;box-shadow:0 5px 14px rgba(232,121,0,.22);cursor:pointer}
button:hover{opacity:.9}
@media(max-width:700px){
.grid{grid-template-columns:1fr}
.container{padding:14px 12px 30px}
.card{padding:17px 15px}
}
#adminDashboard{display:none}\n</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL="https://rdclmzalbjdgxcizjdjq.supabase.co";const SUPABASE_ANON_KEY="eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJkY2xtemFsYmpkZ3hjaXpqZGpxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAyNjA4ODcsImV4cCI6MjEwNTgzNjg4N30.3HyvYLYGu6M247apzwvjqfDV1OwwHs7XW_rHh1f6GDs";const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY);</script></head>
<body>

<header class="header">
  <div class="brand">FX <span>FASHION</span> GALLERY</div>
  <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap">
  <div class="subtitle">Premium Store • Admin Dashboard</div>
  <button onclick="adminLogout()" style="padding:9px 14px;background:#fff;color:#111;box-shadow:none">
    LOGOUT
  </button>
</div>
</header>

<div id="adminLogin" style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:#f4f5f7">
  <div style="width:100%;max-width:420px;background:#fff;border:1px solid #e5e5e5;border-radius:20px;padding:28px;box-shadow:0 12px 40px rgba(0,0,0,.08)">
    <div style="text-align:center">
      <div style="font-size:26px;font-weight:900">FX <span style="color:#e87900">FASHION</span> GALLERY</div>
      <div style="margin-top:7px;color:#777;font-size:14px">Secure Admin Login</div>
    </div>

    <form id="adminLoginForm" style="display:grid;gap:14px;margin-top:25px">
      <input id="adminEmail" type="email" placeholder="Admin Email" required
      style="padding:14px;border:1px solid #ddd;border-radius:10px;font-size:15px">

      <input id="adminPassword" type="password" placeholder="Password" required
      style="padding:14px;border:1px solid #ddd;border-radius:10px;font-size:15px">

      <button type="submit">LOGIN TO ADMIN</button>

      <div id="loginMessage" style="text-align:center;font-size:13px;color:#d00;min-height:18px"></div>
    </form>
  </div>
</div>

<main id="adminDashboard" class="container">

  <div class="grid">
    <div class="card">
      <div class="label">TOTAL PRODUCTS</div>
      <div class="value" id="productCount">0</div>
    </div>

    <div class="card">
      <div class="label">TOTAL ORDERS</div>
      <div class="value orange" id="orderCount">0</div>
    </div>

    <div class="card">
      <div class="label">TOTAL SALES</div>
      <div class="value" id="salesTotal">৳0</div>
    </div>
  </div>

  <div class="section-title">Orders</div>

  <div class="panel">
    <div id="ordersBox"></div>
  </div>

  
<div class="section-title">Add Product</div>

<div class="panel">
<form id="productForm" style="display:grid;gap:14px">

<input id="productName" type="text" placeholder="Product name" required
style="padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px">

<select id="productCategory" required
style="padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px">
<option value="">Select category</option>
<option>T-Shirts</option>
<option>Shirts</option>
<option>Pants</option>
</select>

<input id="productPrice" type="number" min="0" placeholder="Price (৳)" required
style="padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px">

<input id="productOldPrice" type="number" min="0" placeholder="Old price (optional)"
style="padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px">

<input id="productSizes" type="text" placeholder="Sizes e.g. M,L,XL,XXL"
style="padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px">

<input id="productColors" type="text" placeholder="Colors e.g. Black,White"
style="padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px">

<label style="font-weight:800;font-size:14px">Product Image</label>

<input id="productImage" type="file" accept="image/*"
style="padding:10px;border:1px solid #ddd;border-radius:9px">

<img id="imagePreview" alt="Image preview"
style="display:none;width:150px;height:150px;object-fit:cover;border-radius:12px;border:1px solid #ddd">

<textarea id="productDescription" placeholder="Product description" rows="4"
style="padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px"></textarea>

<button type="submit">ADD PRODUCT</button>

</form>
</div>

<div class="section-title">Product List</div>


  <div class="panel">
    <div id="productsBox"></div>
  </div>

</main>

<script src="products.js"></script>
<script>
document.getElementById("productCount").textContent =
  Array.isArray(products) ? products.length : 0;



async function renderAdminOrders() {
  const ordersBox = document.getElementById("ordersBox");

  ordersBox.innerHTML =
    '<div class="empty">Loading orders...</div>';

  const { data: orders, error } = await supabaseClient
    .from("orders")
    .select("*")
    .order("created_at", { ascending: false });

  if (error) {
    console.error("Supabase orders error:", error);
    ordersBox.innerHTML =
      '<div class="empty">Could not load orders.</div>';
    return;
  }

  document.getElementById("orderCount").textContent =
    orders.length;

  const sales = orders.reduce(
    (total, order) => total + Number(order.total || 0),
    0
  );

  document.getElementById("salesTotal").textContent =
    "৳" + sales.toLocaleString();

  if (!orders.length) {
    ordersBox.innerHTML =
      '<div class="empty">No orders available yet.</div>';
    return;
  }

  ordersBox.innerHTML = orders.map(order => `
    <div style="padding:18px 0;border-bottom:1px solid #eee">

      <div style="font-size:13px;color:#777">
        Order ID: ${order.id}
      </div>

      <div style="font-size:17px;font-weight:900;margin-top:5px">
        ${order.customer_name}
      </div>

      <div style="margin-top:6px">
        📞 ${order.customer_phone}
      </div>

      <div style="margin-top:6px;color:#555">
        ${order.customer_address}
      </div>

      <div style="margin-top:12px;background:#fafafa;border:1px solid #eee;border-radius:10px;padding:12px">

        <div style="font-size:13px;font-weight:900;margin-bottom:8px">
          ORDER ITEMS
        </div>

        ${
          Array.isArray(order.items)
            ? order.items.map(item => `
              <div style="padding:9px 0;border-bottom:1px solid #eee">

                <div style="font-weight:800">
                  ${item.name}
                </div>

                <div style="font-size:12px;color:#666;margin-top:4px">
                  ${item.size ? "Size: " + item.size : ""}
                  ${item.color ? " • Color: " + item.color : ""}
                  • Qty: ${item.quantity}
                </div>

                <div style="font-size:13px;font-weight:800;margin-top:4px">
                  ৳${Number(item.price).toLocaleString()} × ${item.quantity}
                  = ৳${(Number(item.price) * Number(item.quantity)).toLocaleString()}
                </div>

              </div>
            `).join("")
            : '<div style="font-size:13px;color:#777">No item details available.</div>'
        }

        <div style="margin-top:10px;font-size:13px">
          Delivery:
          <strong>৳${Number(order.delivery_charge || 0).toLocaleString()}</strong>
        </div>

        <div style="margin-top:6px;font-size:14px;font-weight:900">
          Subtotal:
          ৳${Number(order.subtotal || 0).toLocaleString()}
        </div>

      </div>

      <div style="margin-top:10px;font-size:13px">
        ${order.delivery_area} • ${order.payment_method}
      </div>

      <div style="margin-top:12px;font-weight:900">
        Total:
        <span style="color:#e87900">
          ৳${Number(order.total || 0).toLocaleString()}
        </span>
      </div>

      <div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">

        <select
          onchange="updateOrderStatus('${order.id}', this.value)"
          style="padding:9px 12px;border:1px solid #ddd;border-radius:8px;font-weight:700;background:#fff"
        >
          ${["New","Confirmed","Processing","Shipped","Delivered","Cancelled"].map(status => `
            <option value="${status}" ${order.status === status ? "selected" : ""}>
              ${status}
            </option>
          `).join("")}
        </select>

        <span style="display:inline-block;background:#fff3e8;color:#e87900;padding:6px 10px;border-radius:20px;font-size:12px;font-weight:900">
          ${order.status || "New"}
        </span>

      </div>

    </div>
  `).join("");
}

async function updateOrderStatus(orderId, newStatus) {

  const { error } = await supabaseClient
    .from("orders")
    .update({ status: newStatus })
    .eq("id", orderId);

  if (error) {
    console.error("Status update error:", error);
    alert("Could not update order.");
    return;
  }

  renderAdminOrders();
}

function renderAdminProducts() {
  const savedProducts = JSON.parse(
    localStorage.getItem("fxProducts") || "[]"
  );

  const allProducts = [
    ...(Array.isArray(products) ? products : []),
    ...savedProducts
  ];

  document.getElementById("productCount").textContent =
    allProducts.length;

  if (!allProducts.length) {
    productsBox.innerHTML =
      '<div class="empty">No products available.</div>';
    return;
  }

  productsBox.innerHTML = allProducts.map(product => `
    <div style="padding:16px 0;border-bottom:1px solid #eee">
      ${
        product.image
          ? `<img src="${product.image}" alt=""
              style="width:90px;height:90px;object-fit:cover;border-radius:10px;margin-bottom:10px">`
          : ""
      }
      <div style="font-weight:900;font-size:16px">
        ${product.name}
      </div>

      <div style="color:#777;font-size:13px;margin-top:5px">
        ${product.category} •
        ${product.stock ? "Available" : "Out of Stock"}
      </div>

      <div style="margin-top:8px;font-weight:900;color:#e87900">
        ৳${product.price}
      </div>
    </div>
  `).join("");
}

const productsBox = document.getElementById("productsBox");

renderAdminProducts();
</script>


<script>
const productImageInput = document.getElementById("productImage");
const imagePreview = document.getElementById("imagePreview");

productImageInput.addEventListener("change", function () {
  const file = this.files[0];

  if (!file) {
    imagePreview.style.display = "none";
    imagePreview.removeAttribute("src");
    return;
  }

  const reader = new FileReader();

  reader.onload = function (event) {
    imagePreview.src = event.target.result;
    imagePreview.style.display = "block";
  };

  reader.readAsDataURL(file);
});

document.getElementById("productForm").addEventListener("submit", function (event) {
  event.preventDefault();

  const imageFile = document.getElementById("productImage").files[0];

  const product = {
    id: Date.now(),
    name: document.getElementById("productName").value.trim(),
    category: document.getElementById("productCategory").value,
    price: Number(document.getElementById("productPrice").value),
    oldPrice: Number(document.getElementById("productOldPrice").value) || 0,
    sizes: document.getElementById("productSizes").value
      .split(",")
      .map(x => x.trim())
      .filter(Boolean),
    colors: document.getElementById("productColors").value
      .split(",")
      .map(x => x.trim())
      .filter(Boolean),
    description: document.getElementById("productDescription").value.trim(),
    stock: true,
    image: ""
  };

  const saveProduct = (imageData) => {
    product.image = imageData || "";

    const saved = JSON.parse(
      localStorage.getItem("fxProducts") || "[]"
    );

    saved.push(product);

    localStorage.setItem(
      "fxProducts",
      JSON.stringify(saved)
    );

    alert("Product saved successfully!");

    this.reset();

    imagePreview.style.display = "none";
    imagePreview.removeAttribute("src");

    renderAdminProducts();
  };

  if (imageFile) {
    const reader = new FileReader();

    reader.onload = function (event) {
      saveProduct(event.target.result);
    };

    reader.readAsDataURL(imageFile);
  } else {
    saveProduct("");
  }
});
</script>


<script>
document.getElementById("adminLoginForm").addEventListener("submit", async function(e){
  e.preventDefault();

  const email=document.getElementById("adminEmail").value.trim();
  const password=document.getElementById("adminPassword").value;
  const message=document.getElementById("loginMessage");

  message.style.color="#777";
  message.textContent="Signing in...";

  const {data,error}=await supabaseClient.auth.signInWithPassword({
    email:email,
    password:password
  });

  if(error){
    console.error(error);
    message.style.color="#d00";
    message.textContent="Invalid email or password.";
    return;
  }

  document.getElementById("adminLogin").style.display="none";
  document.getElementById("adminDashboard").style.display="block";

  renderAdminOrders();
});
</script>


<script>
async function checkAdminSession(){
  const {data}=await supabaseClient.auth.getSession();

  if(data.session){
    document.getElementById("adminLogin").style.display="none";
    document.getElementById("adminDashboard").style.display="block";
    renderAdminOrders();
  }else{
    document.getElementById("adminLogin").style.display="flex";
    document.getElementById("adminDashboard").style.display="none";
  }
}

async function adminLogout(){
  await supabaseClient.auth.signOut();
  location.reload();
}

checkAdminSession();
</script>

</body>
</html>
