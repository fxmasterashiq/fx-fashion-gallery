<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<meta name="theme-color" content="#111111">
<title>FX Fashion Gallery | Admin</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,Helvetica,sans-serif;background:#f6f6f6;color:#111}
.header{background:#111;color:#fff;padding:20px}
.brand{font-size:22px;font-weight:900;letter-spacing:1px}
.brand span{color:#e87900}
.subtitle{margin-top:5px;color:#aaa;font-size:13px}
.container{max-width:1100px;margin:auto;padding:20px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px;margin-bottom:20px}
.card{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:20px;box-shadow:0 4px 15px rgba(0,0,0,.04)}
.label{font-size:13px;color:#777}
.value{font-size:28px;font-weight:900;margin-top:8px}
.orange{color:#e87900}
.section-title{font-size:20px;font-weight:900;margin:25px 0 12px}
.panel{background:#fff;border:1px solid #e5e5e5;border-radius:14px;padding:20px}
.empty{text-align:center;padding:35px 15px;color:#777}
button{border:0;border-radius:9px;padding:12px 18px;background:#e87900;color:#fff;font-weight:800;cursor:pointer}
button:hover{opacity:.9}
@media(max-width:700px){
.grid{grid-template-columns:1fr}
.container{padding:14px}
.card{padding:17px}
}
</style>
</head>
<body>

<header class="header">
  <div class="brand">FX <span>FASHION</span> GALLERY</div>
  <div class="subtitle">Premium Store • Admin Dashboard</div>
</header>

<main class="container">

  <div class="grid">
    <div class="card">
      <div class="label">TOTAL PRODUCTS</div>
      <div class="value" id="productCount">0</div>
    </div>

    <div class="card">
      <div class="label">TOTAL ORDERS</div>
      <div class="value orange" id="orderCount">0</div>
    </div>

    <div class="card">
      <div class="label">TOTAL SALES</div>
      <div class="value" id="salesTotal">৳0</div>
    </div>
  </div>

  <div class="section-title">Orders</div>

  <div class="panel">
    <div class="empty" id="ordersBox">
      No orders available yet.
    </div>
  </div>

  
<div class="section-title">Add Product</div>

<div class="panel">
<form id="productForm" style="display:grid;gap:14px">

<input id="productName" type="text" placeholder="Product name" required
style="padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px">

<select id="productCategory" required
style="padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px">
<option value="">Select category</option>
<option>T-Shirts</option>
<option>Shirts</option>
<option>Pants</option>
</select>

<input id="productPrice" type="number" min="0" placeholder="Price (৳)" required
style="padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px">

<input id="productOldPrice" type="number" min="0" placeholder="Old price (optional)"
style="padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px">

<input id="productSizes" type="text" placeholder="Sizes e.g. M,L,XL,XXL"
style="padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px">

<input id="productColors" type="text" placeholder="Colors e.g. Black,White"
style="padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px">

<label style="font-weight:800;font-size:14px">Product Image</label>

<input id="productImage" type="file" accept="image/*"
style="padding:10px;border:1px solid #ddd;border-radius:9px">

<img id="imagePreview" alt="Image preview"
style="display:none;width:150px;height:150px;object-fit:cover;border-radius:12px;border:1px solid #ddd">

<textarea id="productDescription" placeholder="Product description" rows="4"
style="padding:13px;border:1px solid #ddd;border-radius:9px;font-size:15px"></textarea>

<button type="submit">ADD PRODUCT</button>

</form>
</div>

<div class="section-title">Product List</div>


  <div class="panel">
    <div id="productsBox"></div>
  </div>

</main>

<script src="products.js"></script>
<script>
document.getElementById("productCount").textContent =
  Array.isArray(products) ? products.length : 0;


function renderAdminProducts() {
  const savedProducts = JSON.parse(
    localStorage.getItem("fxProducts") || "[]"
  );

  const allProducts = [
    ...(Array.isArray(products) ? products : []),
    ...savedProducts
  ];

  document.getElementById("productCount").textContent =
    allProducts.length;

  if (!allProducts.length) {
    productsBox.innerHTML =
      '<div class="empty">No products available.</div>';
    return;
  }

  productsBox.innerHTML = allProducts.map(product => `
    <div style="padding:16px 0;border-bottom:1px solid #eee">
      ${
        product.image
          ? `<img src="${product.image}" alt=""
              style="width:90px;height:90px;object-fit:cover;border-radius:10px;margin-bottom:10px">`
          : ""
      }
      <div style="font-weight:900;font-size:16px">
        ${product.name}
      </div>

      <div style="color:#777;font-size:13px;margin-top:5px">
        ${product.category} •
        ${product.stock ? "Available" : "Out of Stock"}
      </div>

      <div style="margin-top:8px;font-weight:900;color:#e87900">
        ৳${product.price}
      </div>
    </div>
  `).join("");
}

const productsBox = document.getElementById("productsBox");

renderAdminProducts();
</script>


<script>
const productImageInput = document.getElementById("productImage");
const imagePreview = document.getElementById("imagePreview");

productImageInput.addEventListener("change", function () {
  const file = this.files[0];

  if (!file) {
    imagePreview.style.display = "none";
    imagePreview.removeAttribute("src");
    return;
  }

  const reader = new FileReader();

  reader.onload = function (event) {
    imagePreview.src = event.target.result;
    imagePreview.style.display = "block";
  };

  reader.readAsDataURL(file);
});

document.getElementById("productForm").addEventListener("submit", function (event) {
  event.preventDefault();

  const imageFile = document.getElementById("productImage").files[0];

  const product = {
    id: Date.now(),
    name: document.getElementById("productName").value.trim(),
    category: document.getElementById("productCategory").value,
    price: Number(document.getElementById("productPrice").value),
    oldPrice: Number(document.getElementById("productOldPrice").value) || 0,
    sizes: document.getElementById("productSizes").value
      .split(",")
      .map(x => x.trim())
      .filter(Boolean),
    colors: document.getElementById("productColors").value
      .split(",")
      .map(x => x.trim())
      .filter(Boolean),
    description: document.getElementById("productDescription").value.trim(),
    stock: true,
    image: ""
  };

  const saveProduct = (imageData) => {
    product.image = imageData || "";

    const saved = JSON.parse(
      localStorage.getItem("fxProducts") || "[]"
    );

    saved.push(product);

    localStorage.setItem(
      "fxProducts",
      JSON.stringify(saved)
    );

    alert("Product saved successfully!");

    this.reset();

    imagePreview.style.display = "none";
    imagePreview.removeAttribute("src");

    renderAdminProducts();
  };

  if (imageFile) {
    const reader = new FileReader();

    reader.onload = function (event) {
      saveProduct(event.target.result);
    };

    reader.readAsDataURL(imageFile);
  } else {
    saveProduct("");
  }
});
</script>

</body>
</html>
